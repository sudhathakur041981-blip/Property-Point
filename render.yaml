services:
  - type: web
    name: property-point-backend
    runtime: python
    buildCommand: python -m py_compile server.py
    startCommand: python server.py
    envVars:
      - key: PROPERTY_POINT_HOST
        value: 0.0.0.0
      - key: PROPERTY_POINT_CROSS_SITE_COOKIES
        value: "1"
      - key: PROPERTY_POINT_ADMIN_USERNAME
        value: admin
      - key: PROPERTY_POINT_ADMIN_TOKEN
        generateValue: true
